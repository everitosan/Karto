[package]
name = "karto"
version = "0.0.0"
description = "Karto — mapeo cifrado de infraestructura"
authors = ["evesan <everardo.ipn@gmail.com>"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "karto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Base de datos cifrada (SQLCipher estático, sin dependencias del sistema).
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }

# Limpieza de memoria de secretos.
zeroize = { version = "1", features = ["derive"] }

# Derivación de clave del vault: Argon2id (contraseña maestra → clave AES-256 cruda).
argon2 = "0.5"
rand = "0.8"
hex = "0.4"

# Import de ~/.ssh/config
ssh2-config = "0.5"

# Idioma del SO para el i18n (detección del locale del sistema).
tauri-plugin-os = "2"

[features]
# Nada por defecto; features añadidas por plataforma si hace falta.
default = []
