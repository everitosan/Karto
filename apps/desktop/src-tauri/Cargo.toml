[package]
name = "karto"
version = "0.0.0"
description = "Karto — mapeo cifrado de infraestructura"
authors = ["Karto"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "karto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Base de datos cifrada (SQLCipher estático, sin dependencias del sistema).
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }

# Limpieza de memoria de secretos.
zeroize = { version = "1", features = ["derive"] }

# Import de ~/.ssh/config
ssh2-config = "0.5"

[features]
# Nada por defecto; features añadidas por plataforma si hace falta.
default = []
